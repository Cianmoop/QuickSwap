name: quick_swap
description: QuickSwap - 局域网直传照片与视频，无需云端。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  photo_manager: ^3.6.4
  permission_handler: ^11.4.0
  dio: ^5.8.0+1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  wakelock_plus: ^1.3.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
